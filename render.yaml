services:
  - type: web
    name: archana-portfolio
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMAILJS_SERVICE_ID
        value: service_3rp0pzw
      - key: EMAILJS_TEMPLATE_ID
        value: template_kftks3h
      - key: EMAILJS_PUBLIC_KEY
        value: OdPKA-y21b2JOKC17
